  <base href="/">
  <meta name="theme-color" content="#0b0f14">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <link rel="preconnect" href="https://fonts.googleapis.com">

<body>
  <!--
    THESIS: The city is the interface. Each market is a photo card you swipe; its photo, defocused, becomes the room the rest of the app sits in, and its colour tints every control. Refuses the default rate-table/list-of-rows layout.
    OWN-WORLD: Ink #0b0f14 ground; frosted glass panels (white 7% / ink 46%, 1px light edge, no drop shadows on glass); per-city tint sampled from its photo (Baghdad tower-glass teal #7fd0de, Erbil citadel sand #e2bd7f, Basra dusk-slate #a4bde8); Readex Pro; Lucide-geometry icons.
    STORY: Open → see your city's buy/sell price at a glance and that it is live → swipe to compare cities → convert an amount → share the rate to a chat.
    FIRST VIEWPORT: Title + live pill top; one city card ~84% wide, ~56vh tall, name top-start, glass quote panel at the bottom holding sell/buy per $100 with hints and change; neighbouring cards peek; city pills below; converter peeks under the fold. Primary action: Telegram main button "share this city's rate".
    FORM: Brief-pinned (glass, swipeable photo city cards); no seed roll.
    FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance
  -->
  <app-root></app-root>
</body>
</html>
