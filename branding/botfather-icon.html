<!doctype html>
<!--
  BotFather Mini App picture (640×360): the flat two-coin logo from logo.html, centred on slate
  (#1e2a36; symbols ink #0b0f14, Baghdad teal #7fd0de, white).
  To re-render, from this folder:
  "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars \
    --force-device-scale-factor=2 --window-size=640,360 --virtual-time-budget=6000 \
    --screenshot="$PWD/botfather-icon@2x.png" "file://$PWD/botfather-icon.html"
  sips -z 360 640 botfather-icon@2x.png --out botfather-icon.png
-->
<html lang="ar">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@700&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; }
  body {
    width: 640px;
    height: 360px;
    overflow: hidden;
    display: grid;
    place-items: center;
    /* Flat slate ground, like the logo. */
    background: #1e2a36;
  }
  svg { height: 300px; }
  text { font-family: 'Readex Pro', sans-serif; font-weight: 700; }
</style>
</head>
<body>
<svg viewBox="150 170 724 724" xmlns="http://www.w3.org/2000/svg">
  <!-- Same flat mark as logo.html: dinar coin (white) and dollar coin (Baghdad teal), cut apart by an ink ring. -->
  <circle cx="400" cy="420" r="200" fill="#ffffff" />
  <circle cx="624" cy="604" r="232" fill="#1e2a36" />
  <circle cx="624" cy="604" r="200" fill="#7fd0de" />
  <text x="372" y="390" dy="0.36em" text-anchor="middle" direction="rtl" font-size="130" fill="#0b0f14">د.ع</text>
  <text x="624" y="604" dy="0.36em" text-anchor="middle" font-size="250" fill="#0b0f14">$</text>
</svg>
</body>
</html>
