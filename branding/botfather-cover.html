<!doctype html>
<!--
  BotFather Mini App picture (640×360). To re-render after editing, from this folder:
  "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars \
    --force-device-scale-factor=2 --window-size=640,360 --virtual-time-budget=6000 \
    --screenshot="$PWD/botfather-cover@2x.png" "file://$PWD/botfather-cover.html"
  sips -z 360 640 botfather-cover@2x.png --out botfather-cover.png
-->
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;600;700&display=block" rel="stylesheet">
<style>
  :root {
    --ink: #0b0f14;
    --text-2: rgb(255 255 255 / 78%);
    --baghdad: #7fd0de;
    --erbil: #e2bd7f;
    --basra: #a4bde8;
  }
  html, body { margin: 0; }
  body {
    width: 640px;
    height: 360px;
    overflow: hidden;
    position: relative;
    background: var(--ink);
    font-family: 'Readex Pro', sans-serif;
    color: #fff;
  }

  /* Three city photos, Baghdad on the right as Arabic reads. */
  .cities {
    position: absolute;
    inset: 0;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 3px;
  }
  .city { position: relative; overflow: hidden; }
  .city img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: saturate(1.1) brightness(0.82);
  }
  .city.baghdad img { object-position: 40% 8%; }
  .city.erbil img { object-position: 72% 30%; }
  .city.basra img { object-position: 45% 50%; }

  .shade {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 70% 55% at 50% 44%, rgb(11 15 20 / 62%), rgb(11 15 20 / 10%) 75%),
      linear-gradient(0deg, rgb(11 15 20 / 92%) 0%, rgb(11 15 20 / 0%) 34%),
      linear-gradient(180deg, rgb(11 15 20 / 45%) 0%, rgb(11 15 20 / 0%) 30%);
  }

  .title {
    position: absolute;
    inset-inline: 0;
    top: 74px;
    text-align: center;
  }
  h1 {
    margin: 0;
    font-size: 66px;
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.1;
    text-shadow: 0 4px 24px rgb(0 0 0 / 55%);
  }
  .sub {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-top: 14px;
    padding: 7px 16px;
    border-radius: 999px;
    background: rgb(10 14 20 / 55%);
    border: 1px solid rgb(255 255 255 / 18%);
    backdrop-filter: blur(14px);
    font-size: 17px;
    font-weight: 600;
  }
  .dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #7ee2a8;
    box-shadow: 0 0 0 4px rgb(126 226 168 / 22%);
  }

  .labels {
    position: absolute;
    inset-inline: 0;
    bottom: 16px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    text-align: center;
    font-size: 19px;
    font-weight: 600;
  }
  .labels span::after {
    content: '';
    display: block;
    width: 26px;
    height: 3px;
    margin: 6px auto 0;
    border-radius: 2px;
    background: currentColor;
  }
  .labels .baghdad { color: var(--baghdad); }
  .labels .erbil { color: var(--erbil); }
  .labels .basra { color: var(--basra); }
</style>
</head>
<body>
  <div class="cities">
    <div class="city baghdad"><img src="../public/cities/baghdad.jpg" alt=""></div>
    <div class="city erbil"><img src="../public/cities/erbil.jpg" alt=""></div>
    <div class="city basra"><img src="../public/cities/basra.jpg" alt=""></div>
  </div>
  <div class="shade"></div>

  <div class="title">
    <h1>شكد الدولار؟</h1>
    <div class="sub"><span class="dot"></span>سعر الدولار مقابل الدينار · مباشر</div>
  </div>

  <div class="labels">
    <span class="baghdad">بغداد</span>
    <span class="erbil">أربيل</span>
    <span class="basra">البصرة</span>
  </div>
</body>
</html>
